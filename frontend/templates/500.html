{% extends 'base.html' %}

{% block title %}Sunucu Hatası — Hangisi?{% endblock %}

{% block content %}
<div class="container" style="padding: 60px 20px 100px; text-align: center;">
    <div class="form-card" style="margin: 0 auto; padding: 48px 32px;">
        <div style="font-size: 4rem; font-weight: 800; color: var(--accent-orange); line-height: 1; margin-bottom: 16px;">
            500
        </div>
        <h1 style="font-size: 1.6rem; font-weight: 800; margin-bottom: 12px; color: var(--text-main);">
            Bir şeyler ters gitti
        </h1>
        <p style="color: var(--text-muted); font-size: 1rem; margin-bottom: 28px; max-width: 420px; margin-left: auto; margin-right: auto;">
            Sunucuda beklenmeyen bir sorun oluştu. Lütfen biraz sonra tekrar deneyin.
        </p>
        <div>
            <a href="{% url 'polls:feed' %}" class="btn btn-primary" style="padding: 12px 28px;">
                Ana Sayfaya Dön
            </a>
        </div>
    </div>
</div>
{% endblock %}
